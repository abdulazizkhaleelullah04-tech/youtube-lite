app-id: io.github.aziz.YouTubeLite
runtime: org.gnome.Sdk
runtime-version: '49'
sdk: org.gnome.Sdk
command: youtube-lite

finish-args:
  - --socket=fallback-x11
  - --socket=wayland
  - --socket=pulseaudio
  - --device=dri
  - --share=network

modules:
  - name: youtube-lite
    buildsystem: simple
    build-commands:
      - cc src/main.c -o youtube-lite $(pkg-config --cflags --libs gtk4 webkitgtk-6.0)
      - mkdir -p webext
      - cc -shared -fPIC webext/webextension.c -o webext/libyoutube-lite-webextension.so $(pkg-config --cflags --libs webkitgtk-6.0)
      - install -D -m 755 youtube-lite /app/bin/youtube-lite
      - install -D -m 755 webext/libyoutube-lite-webextension.so /app/lib/webext/libyoutube-lite-webextension.so
    sources:
      - type: dir
        path: .
