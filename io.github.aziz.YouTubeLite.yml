app-id: io.github.aziz.YouTubeLite
runtime: org.gnome.Sdk
runtime-version: '49'
sdk: org.gnome.Sdk
command: youtube-lite

finish-args:
  - --share=network
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=ipc

modules:
  - name: youtube-lite
    buildsystem: simple

    build-commands:
      - cc src/main.c -o youtube-lite $(pkg-config --cflags --libs gtk4 webkitgtk-6.0)
      - mkdir -p webext
      - cc -shared -fPIC webext/webextension.c -o webext/libyoutube-lite-webextension.so $(pkg-config --cflags --libs webkitgtk-6.0)
      - install -Dm755 youtube-lite /app/bin/youtube-lite
      - install -Dm755 webext/libyoutube-lite-webextension.so /app/lib/youtube-lite/webextensions/libyoutube-lite-webextension.so
      - install -Dm644 data/io.github.aziz.YouTubeLite.desktop /app/share/applications/io.github.aziz.YouTubeLite.desktop
      - install -Dm644 data/io.github.aziz.YouTubeLite.metainfo.xml /app/share/metainfo/io.github.aziz.YouTubeLite.metainfo.xml
      - install -Dm644 data/icons/hicolor/scalable/apps/io.github.aziz.YouTubeLite.svg /app/share/icons/hicolor/scalable/apps/io.github.aziz.YouTubeLite.svg

    sources:
      - type: dir
        path: .
